<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tab Organizer</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="panel">
    <header class="top">
      <h1>Tab Organizer</h1>
      <button id="dashboardBtn" class="dashboard-cta">Open dashboard</button>
    </header>

    <section class="search-section">
      <label class="field">
        <span>Search tabs</span>
        <input id="searchInput" type="text" placeholder="Type tab title or URL" />
      </label>
      <div id="searchResults" class="search-results"></div>
    </section>

    <section class="recent-section">
      <p class="section-title">Recent tabs</p>
      <div id="recentTabs" class="search-results"></div>
    </section>

    <section class="settings-card">
      <div class="grid-two">
        <label class="field compact">
          <span>Organize mode</span>
          <select id="mode">
            <option value="smart">Smart (category + domain)</option>
            <option value="domain">Domain</option>
            <option value="title">Title similarity</option>
            <option value="category">Category first</option>
          </select>
        </label>

        <label class="field compact">
          <span>Max tabs/window</span>
          <input id="maxTabsPerWindow" type="number" min="1" max="50" value="10" />
        </label>
      </div>

      <div class="grid-two">
        <label class="field compact">
          <span>Group into</span>
          <select id="groupingMethod">
            <option value="windows">Separate windows</option>
            <option value="tabGroups">Tab groups (single window)</option>
          </select>
        </label>

        <label class="field compact">
          <span>Scope</span>
          <select id="profileScope">
            <option value="allWindows">All windows</option>
            <option value="currentWindow">Current window only</option>
          </select>
        </label>
      </div>

      <div class="check-grid">
        <label class="checkbox-row compact-row">
          <input id="includePinned" type="checkbox" />
          <span>Include pinned</span>
        </label>

        <label class="checkbox-row compact-row">
          <input id="separateGoogleWorkspace" type="checkbox" checked />
          <span>Split Docs/Sheets/Slides</span>
        </label>
      </div>

      <div class="grid-two">
        <label class="field compact">
          <span>Stale days</span>
          <input id="cleanupStaleDays" type="number" min="1" max="365" value="14" />
        </label>

        <label class="field compact">
          <span>Schedule</span>
          <select id="scheduleMode">
            <option value="off">Off</option>
            <option value="hourly">Every X hours</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
          </select>
        </label>
      </div>

      <label id="scheduleIntervalWrap" class="field compact">
        <span>Interval (hours)</span>
        <input id="scheduleIntervalHours" type="number" min="1" max="168" value="24" />
      </label>

      <div id="scheduleTimeWrap" class="grid-two">
        <label class="field compact">
          <span>Weekday</span>
          <select id="scheduleWeekday">
            <option value="0">Sunday</option>
            <option value="1">Monday</option>
            <option value="2">Tuesday</option>
            <option value="3">Wednesday</option>
            <option value="4">Thursday</option>
            <option value="5">Friday</option>
            <option value="6">Saturday</option>
          </select>
        </label>

        <label class="field compact">
          <span>Time</span>
          <input id="scheduleTime" type="time" value="09:00" />
        </label>
      </div>
    </section>

    <section class="glean-section">
      <div class="glean-header">
        <span class="section-title">Glean AI Organization</span>
        <button id="gleanToggleBtn" type="button" class="glean-toggle-btn">Configure</button>
      </div>
      <div id="gleanConfigPanel" class="glean-config-panel" style="display:none;">
        <label class="field compact">
          <span>Glean instance</span>
          <input id="gleanInstance" type="text" placeholder="your-company" />
        </label>
        <label class="field compact">
          <span>API token</span>
          <input id="gleanToken" type="password" placeholder="Bearer token" />
        </label>
        <div class="glean-config-actions">
          <button id="gleanSaveBtn" type="button" class="glean-save-btn">Save</button>
          <button id="gleanClearBtn" type="button" class="glean-clear-btn">Clear</button>
          <span id="gleanStatus" class="glean-status"></span>
        </div>
      </div>
    </section>

    <div class="action-grid">
      <button id="organizeBtn" class="primary">Auto organize now</button>
      <button id="gleanOrganizeBtn" class="glean-btn" disabled>Organize with Glean</button>
    </div>
    <div class="action-grid-secondary">
      <button id="cleanupBtn" class="secondary">Cleanup tabs</button>
      <button id="restoreBtn" class="secondary">Restore</button>
    </div>

    <div id="gleanErrorPanel" class="glean-error-panel" style="display:none;">
      <p id="gleanErrorMessage" class="glean-error-msg"></p>
      <div class="glean-error-actions">
        <button id="gleanRetryBtn" type="button" class="primary">Try again</button>
        <button id="gleanFallbackBtn" type="button" class="secondary">Organize without Glean</button>
      </div>
    </div>

    <p id="status" aria-live="polite"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
